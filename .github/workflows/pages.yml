# Turned off on 2026-11-23 (MOSA-1727). Rule of 2026-11-22: nothing runs on GitHub-hosted
# runners. This repository has no ha3 runner, so the automatic triggers are removed and the
# jobs name the ha3 labels: a manual run waits for a runner instead of using hosted minutes.
# To turn it on again: Infra Ops registers an ha3 runner for this repository, then restore
# the triggers from the commit before this one.
# Auto-publish the viewer: any push to main that changes web/ deploys it to GitHub
# Pages (the Pages source is "GitHub Actions", not the old gh-pages branch).
# Manual trigger: gh workflow run pages.yml  (also what `make pages` does now).
name: pages
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, ha3]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
